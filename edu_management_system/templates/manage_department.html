<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>院系管理 - 增删查一体</title>
    <style>
        .container { width: 90%; margin: 20px auto; }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #eee; border-radius: 6px; }
        .form-item { margin: 10px 0; }
        label { display: inline-block; width: 80px; text-align: right; margin-right: 10px; }
        input, select { padding: 6px; width: 200px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; color: white; cursor: pointer; margin: 0 5px; }
        .btn-add { background-color: #28a745; }
        .btn-search { background-color: #007bff; }
        .btn-reset { background-color: #6c757d; }
        .btn-delete { background-color: #dc3545; }
        .btn-back { background-color: #ffc107; color: #333; } /* 返回按钮样式 */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f8f9fa; }
        /* 列表标题栏样式 */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .list-header h3 { margin: 0; }
        /* 页面头部（标题+返回按钮） */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .page-header h2 { margin: 0; }
        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            width: 400px;
            margin: 100px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .modal-header h3 { margin: 0; }
        .close-btn {
            font-size: 20px;
            cursor: pointer;
            color: #666;
        }
        .modal-footer {
            text-align: right;
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 页面头部：标题 + 返回按钮 -->
        <div class="page-header">
            <h2>院系管理</h2>
            <button class="btn btn-back" onclick="goBack()">返回主页面</button>
        </div>

        <!-- 查询院系 -->
        <div class="section">
            <h3>查询院系</h3>
            <div class="form-item">
                <label>院系名称：</label><input type="text" id="search_dept_name" placeholder="模糊查询">
                <button class="btn btn-search" onclick="getDepartments()">查询</button>
                <button class="btn btn-reset" onclick="resetSearch()">重置</button>
            </div>
        </div>

        <!-- 院系列表 -->
        <div class="section">
            <div class="list-header">
                <h3>院系列表</h3>
                <button class="btn btn-add" onclick="openAddModal()">新增院系</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>院系ID</th>
                        <th>院系名称</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="dept_list"></tbody>
            </table>
        </div>
    </div>

    <!-- 新增院系弹窗 -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>新增院系</h3>
                <span class="close-btn" onclick="closeAddModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-item">
                    <label>院系名称：</label><input type="text" id="modal_dept_name" placeholder="如：计算机学院、文学院">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-add" onclick="submitAddDepartment()">确认添加</button>
                <button class="btn btn-reset" onclick="closeAddModal()">取消</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(function() { getDepartments(); });

        // 返回主页面
        function goBack() {
            window.location.href = '/'; // 跳转到总入口页面
        }

        // 弹窗操作
        function openAddModal() {
            $('#modal_dept_name').val('');
            $('#addModal').css('display', 'block');
        }
        function closeAddModal() {
            $('#addModal').css('display', 'none');
        }

        // 新增院系
        function submitAddDepartment() {
            const data = { dept_name: $('#modal_dept_name').val() };
            $.ajax({
                url: '/api/departments',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function(res) {
                    alert(res.message);
                    if (res.success) {
                        closeAddModal();
                        getDepartments();
                    }
                }
            });
        }

        // 查询院系
        function getDepartments() {
            const params = { dept_name: $('#search_dept_name').val() };
            $.ajax({
                url: '/api/departments',
                type: 'GET',
                data: params,
                success: function(res) {
                    if (res.success) {
                        let html = '';
                        if (res.data.length === 0) {
                            html = '<tr><td colspan="4">暂无院系数据</td></tr>';
                        } else {
                            res.data.forEach(item => {
                                html += `
                                    <tr>
                                        <td>${item.dept_id}</td>
                                        <td>${item.dept_name}</td>
                                        <td>${item.create_time}</td>
                                        <td><button class="btn btn-delete" onclick="deleteDepartment(${item.dept_id})">删除</button></td>
                                    </tr>
                                `;
                            });
                        }
                        $('#dept_list').html(html);
                    } else {
                        alert(res.message);
                    }
                }
            });
        }

        // 删除院系
        function deleteDepartment(dept_id) {
            if (!confirm(`确定删除ID为${dept_id}的院系？关联专业/班级/学生将一并删除！`)) return;
            $.ajax({
                url: `/api/departments/${dept_id}`,
                type: 'DELETE',
                success: function(res) {
                    alert(res.message);
                    if (res.success) getDepartments();
                }
            });
        }

        // 重置筛选
        function resetSearch() {
            $('#search_dept_name').val('');
            getDepartments();
        }
    </script>
</body>
</html>
