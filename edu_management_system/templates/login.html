<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>系统登录</title>
    <style>
        .login-box {
            width: 400px;
            margin: 100px auto;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
        }
        .login-box h2 {
            margin-bottom: 30px;
            font-weight: bold;
        }
        .form-item {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-item label {
            display: block;
            margin-bottom: 5px;
            font-size: 16px;
        }
        .form-item input {
            width: 100%;
            height: 40px;
            padding: 0 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        .login-btn {
            width: 100%;
            height: 45px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>系统登录</h2>
        <!-- 提交路径改为/login，POST方法 -->
        <form action="/login" method="POST">
            <div class="form-item">
                <label>用户名：</label>
                <input type="text" name="username" value="admin" required>
            </div>
            <div class="form-item">
                <label>密码：</label>
                <input type="password" name="password" required>
                <small style="color: #999;">默认密码：123456</small>
            </div>
            <button type="submit" class="login-btn">登录</button>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
        </form>
    </div>
</body>
</html>
