<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>学生管理 - 增删查一体</title>
    <style>
        .container { width: 90%; margin: 20px auto; }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #eee; border-radius: 6px; }
        .form-item { margin: 10px 0; }
        label { display: inline-block; width: 80px; text-align: right; margin-right: 10px; }
        input, select { padding: 6px; width: 200px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; color: white; cursor: pointer; margin: 0 5px; }
        .btn-add { background-color: #28a745; }
        .btn-search { background-color: #007bff; }
        .btn-reset { background-color: #6c757d; }
        .btn-delete { background-color: #dc3545; }
        .btn-back { background-color: #ffc107; color: #333; } /* 返回按钮样式 */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f8f9fa; }
        /* 列表标题栏样式 */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .list-header h3 { margin: 0; }
        /* 页面头部（标题+返回按钮） */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .page-header h2 { margin: 0; }
        /* 弹窗样式 */
        .modal {
            display: none; /* 默认隐藏 */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5); /* 半透明背景 */
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            width: 600px;
            margin: 100px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .modal-header h3 { margin: 0; }
        .close-btn {
            font-size: 20px;
            cursor: pointer;
            color: #666;
        }
        .modal-footer {
            text-align: right;
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 页面头部：标题 + 返回按钮 -->
        <div class="page-header">
            <h2>学生管理</h2>
            <button class="btn btn-back" onclick="goBack()">返回主页面</button>
        </div>

        <!-- 查询学生 -->
        <div class="section">
            <h3>查询学生</h3>
            <div class="form-item">
                <label>学号：</label><input type="text" id="search_student_id" placeholder="模糊查询">
                <label>姓名：</label><input type="text" id="search_student_name" placeholder="模糊查询">
                <label>班级ID：</label><input type="number" id="search_class_id" placeholder="精确查询">
                <button class="btn btn-search" onclick="getStudents()">查询</button>
                <button class="btn btn-reset" onclick="resetSearch()">重置</button>
            </div>
        </div>

        <!-- 学生列表（新增按钮移到这里） -->
        <div class="section">
            <!-- 列表标题+新增按钮 -->
            <div class="list-header">
                <h3>学生列表</h3>
                <button class="btn btn-add" onclick="openAddModal()">新增学生</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>学号</th>
                        <th>姓名</th>
                        <th>性别</th>
                        <th>班级</th>
                        <th>专业</th>
                        <th>院系</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="student_list"></tbody>
            </table>
        </div>
    </div>

    <!-- 新增学生弹窗（默认隐藏） -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>新增学生</h3>
                <span class="close-btn" onclick="closeAddModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-item">
                    <label>学号：</label><input type="text" id="modal_student_id" placeholder="如：2026001">
                    <label>姓名：</label><input type="text" id="modal_student_name" placeholder="如：张三">
                    <label>性别：</label>
                    <select id="modal_gender">
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>班级ID：</label><input type="number" id="modal_class_id" placeholder="如：1">
                    <label>出生日期：</label><input type="date" id="modal_birth_date">
                    <label>电话：</label><input type="text" id="modal_phone" placeholder="11位手机号">
                </div>
                <div class="form-item">
                    <label>邮箱：</label><input type="email" id="modal_email" placeholder="xxx@xxx.com">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-add" onclick="submitAddStudent()">确认添加</button>
                <button class="btn btn-reset" onclick="closeAddModal()">取消</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        // 页面加载自动查询
        $(function() {
            getStudents();
        });

        // 返回主页面
        function goBack() {
            window.location.href = '/'; // 跳转到总入口页面
        }

        // 打开新增弹窗
        function openAddModal() {
            // 清空弹窗表单
            $('#modal_student_id').val('');
            $('#modal_student_name').val('');
            $('#modal_class_id').val('');
            $('#modal_birth_date').val('');
            $('#modal_phone').val('');
            $('#modal_email').val('');
            // 显示弹窗
            $('#addModal').css('display', 'block');
        }

        // 关闭新增弹窗
        function closeAddModal() {
            $('#addModal').css('display', 'none');
        }

        // 提交新增学生
        function submitAddStudent() {
            const data = {
                student_id: $('#modal_student_id').val(),
                student_name: $('#modal_student_name').val(),
                gender: $('#modal_gender').val(),
                class_id: $('#modal_class_id').val(),
                birth_date: $('#modal_birth_date').val(),
                phone: $('#modal_phone').val(),
                email: $('#modal_email').val()
            };
            $.ajax({
                url: '/api/students',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function(res) {
                    alert(res.message);
                    if (res.success) {
                        closeAddModal(); // 关闭弹窗
                        getStudents(); // 刷新列表
                    }
                }
            });
        }

        // 查询学生
        function getStudents() {
            const params = {
                student_id: $('#search_student_id').val(),
                student_name: $('#search_student_name').val(),
                class_id: $('#search_class_id').val()
            };
            $.ajax({
                url: '/api/students',
                type: 'GET',
                data: params,
                success: function(res) {
                    if (res.success) {
                        let html = '';
                        if (res.data.length === 0) {
                            html = '<tr><td colspan="7">暂无学生数据</td></tr>';
                        } else {
                            res.data.forEach(item => {
                                html += `
                                    <tr>
                                        <td>${item.student_id}</td>
                                        <td>${item.student_name}</td>
                                        <td>${item.gender}</td>
                                        <td>${item.class_name || item.class_id}</td>
                                        <td>${item.major_name}</td>
                                        <td>${item.dept_name}</td>
                                        <td><button class="btn btn-delete" onclick="deleteStudent('${item.student_id}')">删除</button></td>
                                    </tr>
                                `;
                            });
                        }
                        $('#student_list').html(html);
                    } else {
                        alert(res.message);
                    }
                }
            });
        }

        // 删除学生
        function deleteStudent(student_id) {
            if (!confirm(`确定删除学号${student_id}的学生？删除后关联数据将一并清除！`)) return;
            $.ajax({
                url: `/api/students/${student_id}`,
                type: 'DELETE',
                success: function(res) {
                    alert(res.message);
                    if (res.success) getStudents();
                }
            });
        }

        // 重置筛选
        function resetSearch() {
            $('#search_student_id').val('');
            $('#search_student_name').val('');
            $('#search_class_id').val('');
            getStudents();
        }
    </script>
</body>
</html>
