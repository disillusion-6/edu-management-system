<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>专业管理 - 增删查一体</title>
    <style>
        .container { width: 90%; margin: 20px auto; }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #eee; border-radius: 6px; }
        .form-item { margin: 10px 0; }
        label { display: inline-block; width: 80px; text-align: right; margin-right: 10px; }
        input, select { padding: 6px; width: 200px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; color: white; cursor: pointer; margin: 0 5px; }
        .btn-add { background-color: #28a745; }
        .btn-search { background-color: #007bff; }
        .btn-reset { background-color: #6c757d; }
        .btn-delete { background-color: #dc3545; }
        .btn-back { background-color: #ffc107; color: #333; } /* 返回按钮样式 */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f8f9fa; }
        /* 列表标题栏样式 */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .list-header h3 { margin: 0; }
        /* 页面头部（标题+返回按钮） */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .page-header h2 { margin: 0; }
        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            width: 400px;
            margin: 100px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .modal-header h3 { margin: 0; }
        .close-btn {
            font-size: 20px;
            cursor: pointer;
            color: #666;
        }
        .modal-footer {
            text-align: right;
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 页面头部：标题 + 返回按钮 -->
        <div class="page-header">
            <h2>专业管理</h2>
            <button class="btn btn-back" onclick="goBack()">返回主页面</button>
        </div>

        <!-- 查询专业 -->
        <div class="section">
            <h3>查询专业</h3>
            <div class="form-item">
                <label>专业名称：</label><input type="text" id="search_major_name" placeholder="模糊查询">
                <label>院系ID：</label><input type="number" id="search_dept_id" placeholder="精确查询">
                <button class="btn btn-search" onclick="getMajors()">查询</button>
                <button class="btn btn-reset" onclick="resetSearch()">重置</button>
            </div>
        </div>

        <!-- 专业列表 -->
        <div class="section">
            <div class="list-header">
                <h3>专业列表</h3>
                <button class="btn btn-add" onclick="openAddModal()">新增专业</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>专业ID</th>
                        <th>专业名称</th>
                        <th>所属院系</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="major_list"></tbody>
            </table>
        </div>
    </div>

    <!-- 新增专业弹窗 -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>新增专业</h3>
                <span class="close-btn" onclick="closeAddModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-item">
                    <label>专业名称：</label><input type="text" id="modal_major_name" placeholder="如：计算机科学与技术">
                </div>
                <div class="form-item">
                    <label>院系ID：</label><input type="number" id="modal_dept_id" placeholder="如：1">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-add" onclick="submitAddMajor()">确认添加</button>
                <button class="btn btn-reset" onclick="closeAddModal()">取消</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(function() { getMajors(); });

        // 返回主页面
        function goBack() {
            window.location.href = '/'; // 跳转到总入口页面
        }

        // 弹窗操作
        function openAddModal() {
            $('#modal_major_name').val('');
            $('#modal_dept_id').val('');
            $('#addModal').css('display', 'block');
        }
        function closeAddModal() {
            $('#addModal').css('display', 'none');
        }

        // 新增专业
        function submitAddMajor() {
            const data = {
                major_name: $('#modal_major_name').val(),
                dept_id: $('#modal_dept_id').val()
            };
            $.ajax({
                url: '/api/majors',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function(res) {
                    alert(res.message);
                    if (res.success) {
                        closeAddModal();
                        getMajors();
                    }
                }
            });
        }

        // 查询专业
        function getMajors() {
            const params = {
                major_name: $('#search_major_name').val(),
                dept_id: $('#search_dept_id').val()
            };
            $.ajax({
                url: '/api/majors',
                type: 'GET',
                data: params,
                success: function(res) {
                    if (res.success) {
                        let html = '';
                        if (res.data.length === 0) {
                            html = '<tr><td colspan="5">暂无专业数据</td></tr>';
                        } else {
                            res.data.forEach(item => {
                                html += `
                                    <tr>
                                        <td>${item.major_id}</td>
                                        <td>${item.major_name}</td>
                                        <td>${item.dept_name || '未知院系'}</td>
                                        <td>${item.create_time}</td>
                                        <td><button class="btn btn-delete" onclick="deleteMajor(${item.major_id})">删除</button></td>
                                    </tr>
                                `;
                            });
                        }
                        $('#major_list').html(html);
                    } else {
                        alert(res.message);
                    }
                }
            });
        }

        // 删除专业
        function deleteMajor(major_id) {
            if (!confirm(`确定删除ID为${major_id}的专业？关联班级/学生将一并删除！`)) return;
            $.ajax({
                url: `/api/majors/${major_id}`,
                type: 'DELETE',
                success: function(res) {
                    alert(res.message);
                    if (res.success) getMajors();
                }
            });
        }

        // 重置筛选
        function resetSearch() {
            $('#search_major_name').val('');
            $('#search_dept_id').val('');
            getMajors();
        }
    </script>
</body>
</html>
