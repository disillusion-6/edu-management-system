<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>课程管理 - 增删查一体</title>
    <style>
        .container { width: 90%; margin: 20px auto; }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #eee; border-radius: 6px; }
        .form-item { margin: 10px 0; }
        label { display: inline-block; width: 80px; text-align: right; margin-right: 10px; }
        input, select { padding: 6px; width: 200px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; color: white; cursor: pointer; margin: 0 5px; }
        .btn-add { background-color: #28a745; }
        .btn-search { background-color: #007bff; }
        .btn-reset { background-color: #6c757d; }
        .btn-delete { background-color: #dc3545; }
        .btn-back { background-color: #ffc107; color: #333; } /* 返回按钮样式 */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f8f9fa; }
        /* 列表标题栏样式 */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .list-header h3 { margin: 0; }
        /* 页面头部（标题+返回按钮） */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .page-header h2 { margin: 0; }
        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            width: 450px;
            margin: 100px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .modal-header h3 { margin: 0; }
        .close-btn {
            font-size: 20px;
            cursor: pointer;
            color: #666;
        }
        .modal-footer {
            text-align: right;
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 页面头部：标题 + 返回按钮 -->
        <div class="page-header">
            <h2>课程管理</h2>
            <button class="btn btn-back" onclick="goBack()">返回主页面</button>
        </div>

        <!-- 查询课程 -->
        <div class="section">
            <h3>查询课程</h3>
            <div class="form-item">
                <label>课程名称：</label><input type="text" id="search_course_name" placeholder="模糊查询">
                <label>课程类型：</label>
                <select id="search_type">
                    <option value="">全部</option>
                    <option value="必修课">必修课</option>
                    <option value="选修课">选修课</option>
                </select>
                <button class="btn btn-search" onclick="getCourses()">查询</button>
                <button class="btn btn-reset" onclick="resetSearch()">重置</button>
            </div>
        </div>

        <!-- 课程列表 -->
        <div class="section">
            <div class="list-header">
                <h3>课程列表</h3>
                <button class="btn btn-add" onclick="openAddModal()">新增课程</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>课程编号</th>
                        <th>课程名称</th>
                        <th>学分</th>
                        <th>课时</th>
                        <th>课程类型</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="course_list"></tbody>
            </table>
        </div>
    </div>

    <!-- 新增课程弹窗 -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>新增课程</h3>
                <span class="close-btn" onclick="closeAddModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-item">
                    <label>课程编号：</label><input type="text" id="modal_course_id" placeholder="如：CS2026001">
                    <label>课程名称：</label><input type="text" id="modal_course_name" placeholder="如：Python程序设计">
                </div>
                <div class="form-item">
                    <label>学分：</label><input type="number" step="0.5" id="modal_credit" placeholder="如：2.0">
                    <label>课时：</label><input type="number" id="modal_hours" placeholder="如：64">
                    <label>课程类型：</label>
                    <select id="modal_type">
                        <option value="必修课">必修课</option>
                        <option value="选修课">选修课</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-add" onclick="submitAddCourse()">确认添加</button>
                <button class="btn btn-reset" onclick="closeAddModal()">取消</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(function() { getCourses(); });

        // 返回主页面
        function goBack() {
            window.location.href = '/'; // 跳转到总入口页面
        }

        // 弹窗操作
        function openAddModal() {
            $('#modal_course_id').val('');
            $('#modal_course_name').val('');
            $('#modal_credit').val('');
            $('#modal_hours').val('');
            $('#addModal').css('display', 'block');
        }
        function closeAddModal() {
            $('#addModal').css('display', 'none');
        }

        // 新增课程
        function submitAddCourse() {
            const data = {
                course_id: $('#modal_course_id').val(),
                course_name: $('#modal_course_name').val(),
                credit: $('#modal_credit').val(),
                hours: $('#modal_hours').val(),
                type: $('#modal_type').val()
            };
            $.ajax({
                url: '/api/courses',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function(res) {
                    alert(res.message);
                    if (res.success) {
                        closeAddModal();
                        getCourses();
                    }
                }
            });
        }

        // 查询课程
        function getCourses() {
            const params = {
                course_name: $('#search_course_name').val(),
                type: $('#search_type').val()
            };
            $.ajax({
                url: '/api/courses',
                type: 'GET',
                data: params,
                success: function(res) {
                    if (res.success) {
                        let html = '';
                        if (res.data.length === 0) {
                            html = '<tr><td colspan="6">暂无课程数据</td></tr>';
                        } else {
                            res.data.forEach(item => {
                                html += `
                                    <tr>
                                        <td>${item.course_id}</td>
                                        <td>${item.course_name}</td>
                                        <td>${item.credit}</td>
                                        <td>${item.hours}</td>
                                        <td>${item.type}</td>
                                        <td><button class="btn btn-delete" onclick="deleteCourse('${item.course_id}')">删除</button></td>
                                    </tr>
                                `;
                            });
                        }
                        $('#course_list').html(html);
                    } else {
                        alert(res.message);
                    }
                }
            });
        }

        // 删除课程
        function deleteCourse(course_id) {
            if (!confirm(`确定删除编号${course_id}的课程？如有成绩记录将禁止删除！`)) return;
            $.ajax({
                url: `/api/courses/${course_id}`,
                type: 'DELETE',
                success: function(res) {
                    alert(res.message);
                    if (res.success) getCourses();
                }
            });
        }

        // 重置筛选
        function resetSearch() {
            $('#search_course_name').val('');
            $('#search_type').val('');
            getCourses();
        }
    </script>
</body>
</html>
